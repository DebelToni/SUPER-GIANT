name: Build & push giant-training image

on:
  push:
    paths:
      - "Docker/giant-training/**"
      - "Docker/giant-training-S3/**"
      - ".github/workflows/Build_image.yml"

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: giant-training
            image_repo: giant-training
            context: ./Docker/giant-training
            dockerfile: ./Docker/giant-training/Dockerfile
            tag1: latest
            tag2: ${{ github.sha }}
          - image_name: giant-training-S3
            image_repo: giant-training
            context: ./Docker/giant-training-S3
            dockerfile: ./Docker/giant-training-S3/Dockerfile
            tag1: S3
            tag2: S3-${{ github.sha }}

    steps:
      - name: Show disk usage before cleanup
        run: df -h

      - name: Free up disk space on GitHub runner
        run: |
          echo "=== Before cleanup ==="
          df -h

          # Stop using swap and remove the swap file (a few GB)
          sudo swapoff -a || true
          sudo rm -f /swapfile || true

          # Remove large pre-installed SDKs we don't need for Docker builds
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /home/linuxbrew/.linuxbrew || true

          # Clean apt cache
          sudo apt-get clean

          # Prune any pre-existing Docker images/containers/build cache
          sudo docker system prune -af || true
          sudo docker builder prune -af || true

          echo "=== After cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (${{ matrix.image_name }})
        uses: docker/build-push-action@v4
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          pull: true
          no-cache: true
          platforms: linux/amd64 # ← Force amd64 only (no ARM images in the manifest)
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_repo }}:${{ matrix.tag1 }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image_repo }}:${{ matrix.tag2 }}
