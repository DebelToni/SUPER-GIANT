name: Build & push giant-training image

on:
  push:
    paths:
      - 'giant-training/**'

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image (giant-training)
        uses: docker/build-push-action@v4
        with:
          context: ./giant-training
          file: ./giant-training/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/giant-training:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/giant-training:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

