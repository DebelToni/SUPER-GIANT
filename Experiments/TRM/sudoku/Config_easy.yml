model:
  recursion:
    max_supervision_steps: 8

optimizer:
  base_learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 200
  weight_decay: 0.10
  gradient_clip_norm: 1.0

  weight_decay_exclusions:
    - bias
    - scale
    - embedding
    - y_init
    - z_init

training:
  seed: 0
  batch_size: 64
  microbatch_size: null
  supervision_steps: 8
  max_steps: 1000
  log_every: 25
  eval_every: 100
  checkpoint_every: 250

sudoku:
  train_samples: 512
  val_samples: 128
  min_clues: 36
  cache_path: "dataset_artifacts/trm_sudoku/sudoku_easy.npz"
