# SmolLM2-360M Configuration
# HuggingFace repo: HuggingFaceTB/SmolLM2-360M
# Parameters: ~360M, vocab_size=49152

model:
  embedding_size: 960
  num_heads: 15
  num_kv_heads: 5
  num_layers: 32
  feed_forward_size: 2560
  rope_dim: 64
  context_length: 8192
  dropout_rate: 0.0
  activation: silu
  use_remat: false
  param_dtype: float32
  compute_dtype: float32

download:
  hf_repo: "HuggingFaceTB/SmolLM2-360M"
  output_filename: "smollm2-360m.npz"

inference:
  stop_on_eos: true

tokenizer:
  name: "HuggingFaceTB/cosmo2-tokenizer"
