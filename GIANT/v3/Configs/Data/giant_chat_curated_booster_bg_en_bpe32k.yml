tokenizer:
  name: "unused"
  cache_dir: "/proj/giant-data/hf_cache/tokenizer_cache"
  use_custom: true
  custom_path: "/proj/giant-data/GIANT/GIANT-Chat/tokenizers/giant_chat_bg_en_bpe32k"

paths:
  data_root: "/proj/giant-data"
  hf_cache_root: "/proj/giant-data/hf_cache"

outputs:
  processed_root: "/proj/giant-data/GIANT/GIANT-Chat/data/curated_booster_bg_en_bpe32k"
  rows_per_shard: 4096
  manifest_filename: "datasets_manifest.json"
  stats_filename: "dataset_stats.json"

scheduling:
  seed: 4212
  write_batch_size: 32
  dry_run_preview_rows: 64

stages:
  curated_booster_bg_en:
    description: "Curated factual booster rows kept in English and mirrored into Bulgarian"
    output_dir: "curated_booster_bg_en"
    sequence_length: 256
    min_tokens: 32
    pack_sequences: true
    add_eos: true
    deduplicate: false
    normalization:
      nfkc: true
      collapse_whitespace: true
    sources:
      - type: json
        json_root: "/proj/giant-data/GIANT/GIANT-Chat/data_curation/curated_booster_bg_en_v1"
        file_glob: "bilingual_booster.jsonl"
        text_field: "text"
