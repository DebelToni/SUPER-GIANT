global_seed: 0
model:
  embedding_size: 640
  num_heads: 10
  num_kv_heads: 10
  num_layers: 16
  feed_forward_size: 2560
  rope_dim: 64
  context_length: 131072
  dropout_rate: 0.0
  activation: silu
  use_remat: true
  enable_xsa: true
  causal: true
  param_dtype: float32
  compute_dtype: bfloat16
tokenizer:
