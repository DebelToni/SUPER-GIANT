global_seed: 0
model:
  mode: encoder
  embedding_size: 448
  num_heads: 7
  num_kv_heads: 7
  num_layers: 12
  feed_forward_size: 1792
  rope_dim: 64
  context_length: 512
  dropout_rate: 0.0
  activation: silu
  use_remat: false
  enable_xsa: true
  param_dtype: float32
  compute_dtype: bfloat16
tokenizer:
  name: unused
  cache_dir: /proj/giant-data/hf_cache/tokenizer_cache
  use_custom: true
  custom_path: /proj/giant-data/GIANT/Long/tokenizers/long_wordlevel
  pad_token_override: null
optimizer:
  base_learning_rate: 0.0002
  min_learning_rate: 2.0e-05
  warmup_tokens: 12000
  weight_decay: 0.1
  gradient_clip_norm: 1.0
  weight_decay_exclusions:
  - bias
  - scale
  - embedding
training:
  batch_size: 1
  gradient_accumulation: 1
  seed: 0
  log_every: 200
  checkpoint_every: 20000
  mini_checkpoint_every: 0
  mini_max_to_keep: 1
  scan_chunk: 1
  prefetch_size: 1
  nan_check: false
  autotune_scan_chunk: false
  autotune_prefetch: false
stages:
- name: compare_ctx512_ans_20k_1ep_encoder_xsa
  dataset: longrecords_l1_ctx512_ans
  seq_len: 512
  epochs: 1
  fraction: 1.0
  shuffle: true
qa_finetune: {}
paths:
  data_root: /proj/giant-data/GIANT
  processed_data_root: dataset_artifacts/long_records
  dataloader_state_root: single-gpu/checkpoints/long/ctx512_ans_20k_1ep_compare/encoder_xsa/dataloader_state
  logs_root: single-gpu/logs/long/ctx512_ans_20k_1ep_compare/encoder_xsa
  checkpoints_root: single-gpu/checkpoints/long/ctx512_ans_20k_1ep_compare/encoder_xsa
  hf_cache_root: /proj/giant-data/hf_cache
inference:
  stop_on_eos: true
