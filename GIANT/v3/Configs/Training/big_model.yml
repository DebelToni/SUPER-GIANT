global_seed: 0

model:
  embedding_size: 1280
  num_heads: 20
  num_kv_heads: 5
  num_layers: 15
  feed_forward_size: 5120
  rope_dim: 64
  context_length: 1024
  dropout_rate: 0.0
  activation: silu
  use_remat: false
  param_dtype: float32
  compute_dtype: bfloat16

tokenizer:
  name: "gpt2"
  cache_dir: "/proj/giant-data/hf_cache/tokenizer_cache"
  use_custom: false
  pad_token_override: null

optimizer:
  base_learning_rate: 8e-5
  min_learning_rate: 8e-6
  warmup_tokens: 75_000_000
  weight_decay: 0.10
  gradient_clip_norm: 1.0
  weight_decay_exclusions:
    - bias
    - scale
    - embedding

training:
  batch_size: 8
  gradient_accumulation: 1
  seed: 0
  log_every: 500
  checkpoint_every: 20000
  mini_checkpoint_every: 10000
  mini_max_to_keep: 1
  scan_chunk: 4
  autotune_scan_chunk: false
  autotune_scan_chunk_candidates: [1, 2, 4, 8, 16, 32]
  autotune_scan_chunk_chunks: 4
  autotune_scan_chunk_steps: 256
  autotune_scan_chunk_persist: true
  prefetch_size: 4
  autotune_prefetch: false
  autotune_prefetch_candidates: [2, 4, 8, 16, 32]
  autotune_prefetch_chunks: 4
  autotune_prefetch_persist: true

stages:
  - name: hq_sentences_warmup
    dataset: 1_hq_sentences_l128
    seq_len: 128
    epochs: 1
    fraction: 1.0
    shuffle: true

  - name: finewiki_backbone
    dataset: 2_finewiki_1b_l256
    seq_len: 256
    epochs: 1
    fraction: 0.5
    shuffle: true

  - name: open_textbooks_longform
    dataset: 3_open_textbooks_l512
    seq_len: 512
    epochs: 1
    fraction: 0.5
    shuffle: true

  - name: fineweb_edu_main
    dataset: 4_fineweb_edu_l512
    seq_len: 512
    epochs: 1
    fraction: 0.4
    shuffle: true

  - name: alpaca_instruction_flavor
    dataset: 5_alpaca_chat_l512
    seq_len: 512
    epochs: 1
    fraction: 1.0
    shuffle: true

qa_finetune: {}

paths:
  data_root: "/proj/giant-data/GIANT"
  processed_data_root: "dataset_artifacts/curriculum_20b"
  dataloader_state_root: "checkpoints/curriculum_20b_big_model/dataloader_state"
  logs_root: "logs/curriculum_20b_big_model"
  checkpoints_root: "checkpoints/curriculum_20b_big_model"
  hf_cache_root: "/proj/giant-data/hf_cache"

inference:
  stop_on_eos: true
