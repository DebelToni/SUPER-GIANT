labels:
  - reject
  - keep

input:
  benchmark_dir: data_curation/quality_filter_bg/benchmarks/bg_full_accessible_v1

output:
  run_dir: data_curation/quality_filter_bg/runs/encoder_bg_full_accessible_smoke_v1

model:
  type: tiny_encoder

features:
  max_tokens: 192

models:
  tiny_encoder:
    embed_dim: 96
    num_heads: 4
    feed_forward_size: 192
    num_layers: 3
    dropout_rate: 0.0
    enable_xsa: false
    param_dtype: float32
    compute_dtype: bfloat16

training:
  batch_size: 64
  num_epochs: 1
  learning_rate: 0.0008
  weight_decay: 0.0001
