labels:
  - reject
  - keep

input:
  benchmark_dir: data_curation/quality_filter_bg/benchmarks/tiny_local

output:
  run_dir: data_curation/quality_filter_bg/runs/encoder_tiny_local

model:
  type: tiny_encoder

features:
  max_tokens: 192

models:
  tiny_encoder:
    embed_dim: 96
    num_heads: 4
    feed_forward_size: 192
    num_layers: 1
    dropout_rate: 0.0
    enable_xsa: false
    param_dtype: float32
    compute_dtype: bfloat16

training:
  batch_size: 32
  num_epochs: 4
  learning_rate: 0.0008
  weight_decay: 0.0001
