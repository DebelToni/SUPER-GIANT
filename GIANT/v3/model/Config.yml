model:
  embedding_size: 640
  num_heads: 10
  num_kv_heads: 5
  num_layers: 16
  feed_forward_size: 2560
  rope_dim: 64
  rope_theta: 10000.0
  context_length: 2048
  dropout_rate: 0.0
  activation: silu
  use_remat: false
  enable_xsa: false
  param_dtype: float32
  compute_dtype: bfloat16 ###

lora:
  enabled: false
  rank: 16
  alpha: 32.0
  dropout: 0.0
  target_modules: [qkv_proj, o_proj, fc1, fc2]
  routing: global
  base_checkpoint: null
  adapter_checkpoint: null

optimizer:
  base_learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_tokens: 1_000_000
  weight_decay: 0.10
  gradient_clip_norm: 1.0

  weight_decay_exclusions:
    - bias
    - scale
    - embedding

training:
  finetune_method: full
  batch_size: 4 ####
  gradient_accumulation: 1
  max_epochs: 3
  seed: 0
  log_every: 2000
  checkpoint_every: 20000
  mini_checkpoint_every: 1000  # Set to 0 or -1 to disable mini checkpoints.
  mini_max_to_keep: 1
  # label_smoothing <- future implement
  scan_chunk: 8

stages:
  - name: sentences_warmup
    dataset: sentences_short
    seq_len: 128
    epochs: 1
    shuffle: true
    fraction: 1.0

  - name: simple_wiki_lm
    dataset: simple_wiki_lm
    seq_len: 128
    epochs: 1
    shuffle: true
    fraction: 1.0

  - name: simple_wiki_core
    dataset: simple_wiki
    seq_len: 128
    epochs: 1
    shuffle: true
    fraction: 1.0

  - name: finewiki_l256
    dataset: finewiki_l256
    seq_len: 256
    epochs: 1
    shuffle: true
    fraction: 1.0

  - name: finewiki_l512
    dataset: finewiki_l512
    seq_len: 512
    epochs: 1
    shuffle: true
    fraction: 1.0

  - name: open_textbooks
    dataset: open_textbooks_l512
    seq_len: 512
    epochs: 1
    shuffle: true
    fraction: 1.0

  - name: fineweb_edu_l512
    dataset: fineweb_edu_l512
    seq_len: 512
    epochs: 1
    shuffle: true
    fraction: 1.0

  - name: fineweb_edu_l1024
    dataset: fineweb_edu_l1024
    seq_len: 1024
    epochs: 1
    shuffle: true
    fraction: 1.0

  - name: definitions_short
    dataset: definitions_short
    seq_len: 128
    epochs: 1
    shuffle: true
    fraction: 1.0

qa_finetune:
  answers_arrow: "teacher_out/answers.arrow"
  batch_size: 4
  context_length: 1024
  num_epochs: 1
  learning_rate: 5.0e-5
  weight_decay: 0.02
  weight_decay_exclusions:
    - bias
    - scale
    - embedding
  warmup_ratio: 0.1
  distill_topk: 8
  distill_temperature: 2.0
  distill_weight: 0.5
  seed: 1
  log_every: 50
  checkpoint_every: 200
  dataset_fraction: 1.0

evaluate:
  total_samples: 50000
  samples_per_stage: 5000
  batch_size: 4
  seed: 42
  checkpoint_dir: "checkpoints"

inference:
  stop_on_eos: true
