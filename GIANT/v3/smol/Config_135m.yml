# SmolLM-135M Configuration
# HuggingFace repo: HuggingFaceTB/SmolLM-135M
# Parameters: ~135M, vocab_size=49152

model:
  embedding_size: 576
  num_heads: 9
  num_kv_heads: 3
  num_layers: 30
  feed_forward_size: 1536
  rope_dim: 64
  context_length: 2048
  dropout_rate: 0.0
  activation: silu
  use_remat: false
  param_dtype: float32
  compute_dtype: float32

download:
  hf_repo: "HuggingFaceTB/SmolLM-135M"
  output_filename: "smollm-135m.npz"

inference:
  stop_on_eos: true

tokenizer:
  name: "HuggingFaceTB/cosmo2-tokenizer"
