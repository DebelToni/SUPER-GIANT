teacher:
  model_name: "clowman/Llama-3.2-3B-Instruct-AWQ-Int4"
  model_tokenizer: "clowman/Llama-3.2-3B-Instruct-AWQ-Int4"
  model_base_url: "http://0.0.0.0:8000/v1"
  api_key: "banangun3000"
  max_model_len: 2048
  temperature: 1.5
  top_p: 0.7
  top_logprobs: 8
  prompt_logprobs: 0
  student_tokenizer_dir: "neo-english-cust"
  user_token: "user"
  ai_token: "assistant"
  write_loss_mask: true
  write_role_ids: true
  num_questions_total: 10000
  questions_per_chunk: 1000
  max_new_tokens_answer: 256
  parallel_calls: 32
  question_system: "You are a teacher language model who is needed to generate questions for a chat interaction based smaller model."
  question_user: "Create a question that is more like an instruction for the model to start writing a story with some factual correctness in it. Basically reproducting a Novel or Wikipedia arcticle. Don't make it about hard topic tho!"
  answer_system: "Answer following the instructions."

outputs:
  out_dir: "teacher_out"
  questions_arrow: "teacher_out/questions.arrow"
  answers_arrow: "teacher_out/answers.arrow"
