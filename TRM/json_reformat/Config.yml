model:
  # Override model defaults for JSON formatting
  vocab_size: 0
  context_length: 256
  embedding_size: 192
  variant: attn        # attn | mlp
  num_heads: 4
  rope_dim: 32
  mixer_hidden: 256
  feed_forward_size: 512
  dropout_rate: 0.0
  activation: silu
  use_remat: true
  add_positional_embedding: true

  recursion:
    L_cycles: 4
    H_cycles: 2
    max_supervision_steps: 8
    enable_early_stop: true
    halt_threshold_logit: 0.0

optimizer:
  base_learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 200
  weight_decay: 0.10
  gradient_clip_norm: 1.0

  weight_decay_exclusions:
    - bias
    - scale
    - embedding

training:
  seed: 0
  batch_size: 64
  microbatch_size: null
  supervision_steps: 8
  max_steps: 2000
  log_every: 25
  eval_every: 200
  checkpoint_every: 500

json_reformat:
  train_path: "dataset_artifacts/json_reformat/train.jsonl"
  val_path: "dataset_artifacts/json_reformat/val.jsonl"
  vocab_path: "dataset_artifacts/json_reformat/vocab.json"
  max_chars: 200
