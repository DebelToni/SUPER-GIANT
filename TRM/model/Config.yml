model:
  # Core sizes
  vocab_size: 10
  context_length: 81
  embedding_size: 128

  # TRM tiny network f_theta
  tiny_layers: 2
  variant: mlp        # attn | mlp

  # Attention variant
  num_heads: 4
  rope_dim: 32

  # MLP-Mixer variant (token mixing over sequence length)
  mixer_hidden: 256

  # Shared
  feed_forward_size: 512
  dropout_rate: 0.0
  activation: silu
  use_remat: true
  add_positional_embedding: true

  # Optional augmentation / puzzle embedding
  augmentation:
    enabled: false
    num_embeddings: 1
    default_id: 0

  # Recursion / refinement
  recursion:
    L_cycles: 6               # n (latent updates per process)
    H_cycles: 3               # T (recursion processes per step)
    max_supervision_steps: 16 # N_sup (outer refinement)
    enable_early_stop: true
    halt_threshold_logit: 0.0

  # Initial states
  init:
    learned_y: true
    learned_z: true
    init_std: 0.02

  # Dtypes
  param_dtype: float32
  compute_dtype: bfloat16

inference:
  return_logits: true

optimizer:
  base_learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 200
  weight_decay: 0.10
  gradient_clip_norm: 1.0

  weight_decay_exclusions:
    - bias
    - scale
    - embedding

training:
  seed: 0
  batch_size: 32
  microbatch_size: null
  supervision_steps: 16
  max_steps: 2000
  log_every: 25
  eval_every: 200
  checkpoint_every: 500

sudoku:
  train_samples: 200
  val_samples: 50
  min_clues: 24
  cache_path: "dataset_artifacts/trm_sudoku/sudoku_hard.npz"
