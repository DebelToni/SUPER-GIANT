model:
  # Core sizes
  vocab_size: 10
  context_length: 81
  embedding_size: 128

  # TRM tiny network f_theta
  tiny_layers: 2
  variant: mlp        # attn | mlp

  # Attention variant
  num_heads: 4
  rope_dim: 32

  # MLP-Mixer variant (token mixing over sequence length)
  mixer_hidden: 256

  # Shared
  feed_forward_size: 512
  dropout_rate: 0.0
  activation: silu
  use_remat: true
  add_positional_embedding: true

  # Optional augmentation / puzzle embedding
  augmentation:
    enabled: false
    num_embeddings: 1
    default_id: 0

  # Recursion / refinement
  recursion:
    L_cycles: 6               # n (latent updates per process)
    H_cycles: 3               # T (recursion processes per step)
    max_supervision_steps: 16 # N_sup (outer refinement)
    enable_early_stop: true
    halt_threshold_logit: 0.0

  # Initial states
  init:
    learned_y: true
    learned_z: true
    init_std: 0.02

  # Dtypes
  param_dtype: float32
  compute_dtype: bfloat16

inference:
  return_logits: true
