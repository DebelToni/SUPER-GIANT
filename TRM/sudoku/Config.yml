optimizer:
  base_learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 200
  weight_decay: 0.10
  gradient_clip_norm: 1.0

  weight_decay_exclusions:
    - bias
    - scale
    - embedding

training:
  seed: 0
  batch_size: 32
  microbatch_size: null
  supervision_steps: 16
  max_steps: 2000
  log_every: 25
  eval_every: 200
  checkpoint_every: 500

sudoku:
  train_samples: 200
  val_samples: 50
  min_clues: 24
  cache_path: "dataset_artifacts/trm_sudoku/sudoku_hard.npz"
