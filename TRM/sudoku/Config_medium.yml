model:
  recursion:
    max_supervision_steps: 16

optimizer:
  base_learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 500
  weight_decay: 0.10
  gradient_clip_norm: 1.0

  weight_decay_exclusions:
    - bias
    - scale
    - embedding
    - y_init
    - z_init

training:
  seed: 0
  batch_size: 128
  microbatch_size: null
  supervision_steps: 16
  max_steps: 5000
  log_every: 50
  eval_every: 500
  checkpoint_every: 1000

sudoku:
  train_samples: 4096
  val_samples: 512
  min_clues: 30
  cache_path: "dataset_artifacts/trm_sudoku/sudoku_medium.npz"
