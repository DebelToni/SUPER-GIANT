tokenizer:
  name: "HuggingFaceTB/cosmo2-tokenizer"
  cache_dir: "/proj/giant-data/hf_cache/tokenizer_cache"
  use_custom: false
  custom_path: "custom_tokenizer"
  pad_token_override: null
  mask_token_override: null

paths:
  data_root: "/proj/giant-data/TiDAR"
  processed_data_root: "dataset_artifacts"
  dataloader_state_root: "checkpoints/dataloader_state"
  logs_root: "logs"
  checkpoints_root: "checkpoints"
  hf_cache_root: "/proj/giant-data/hf_cache"

training_defaults:
  progressive_sequence_lengths: [2048]
  lr_milestones: [0.6667, 0.8333, 0.9444, 0.9889, 1.0]
  warmup_steps: 200
  grad_accumulation: 1
  global_seed: 0

optimizer:
  base_learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  warmup_steps: 200
  weight_decay: 0.0
  gradient_clip_norm: 1.0
  weight_decay_exclusions:
    - bias
    - scale
    - embedding

io:
  shard_size_tokens: 2048
  validation_fraction: 0.01
  min_sequence_tokens: 128
