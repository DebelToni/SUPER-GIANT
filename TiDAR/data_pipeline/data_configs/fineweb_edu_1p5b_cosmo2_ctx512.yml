# FineWeb-Edu shards for SmolLM/TiDAR ablations.
# Tokenizer comes from TiDAR/Global_Config.yml: HuggingFaceTB/cosmo2-tokenizer.

outputs:
  processed_root: "dataset_artifacts/fineweb_edu_1p5b_cosmo2_ctx512"
  rows_per_shard: 65536
  manifest_filename: "datasets_manifest.json"
  stats_filename: "dataset_stats.json"

scheduling:
  seed: 20260530
  write_batch_size: 256
  dry_run_preview_rows: 512

stages:
  fineweb_edu_1p5b_ctx512:
    description: "FineWeb-Edu 1.5B clean-token Cosmo2 shards at 512 context for SmolLM/TiDAR ablations"
    output_dir: "fineweb_edu_1p5b_ctx512"
    sequence_length: 512
    target_tokens: 1500000000
    min_tokens: 64
    pack_sequences: true
    add_eos: true
    emit_final_partial: false
    long_document_strategy: random_window
    random_windows_per_document: 1
    deduplicate: false
    seed_offset: 0
    normalization:
      nfkc: true
      collapse_whitespace: true
    sources:
      - type: huggingface
        dataset_name: "HuggingFaceFW/fineweb-edu"
        split: "train"
        streaming: true
        shuffle_streaming: true
        shuffle_buffer_size: 50000
        shuffle_seed: 20260530
        text_field: "text"
