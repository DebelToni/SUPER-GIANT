model:
  embedding_size: 576
  num_heads: 9
  num_kv_heads: 3
  num_layers: 30
  feed_forward_size: 1536
  rope_dim: 64
  context_length: 2048
  dropout_rate: 0.0
  use_remat: true
  param_dtype: float32
  compute_dtype: bfloat16

tidar:
  draft_length: 8
  attn_bias_value: -1.0e10

inference:
  stop_on_eos: true
  max_decode_steps: 64
  temperature: 1.0
  top_k: 0
  draft_length: 8

optimizer:
  base_learning_rate: 1.0e-4
  min_learning_rate: 1.0e-5
  warmup_steps: 2000
  weight_decay: 0.01
  gradient_clip_norm: 0.5
  weight_decay_exclusions:
    - bias
    - scale
    # - embedding

training:
  batch_size: 2
  gradient_accumulation: 4
  max_epochs: 1
  seed: 0
  log_every: 200
  checkpoint_every: 1000
  mini_checkpoint_every: 100
  mini_max_to_keep: 2
  label_smoothing: 0.05
  scan_chunk: 1

stages:
  - name: fw_edu_1200m
    dataset: fw_edu_1200m
    seq_len: 2048
    epochs: 1
    end_ratio: 0.6667
    shuffle: true
    fraction: 1.0
  - name: cosmopedia_v2_300m
    dataset: cosmopedia_v2_300m
    seq_len: 2048
    epochs: 1
    end_ratio: 0.8333
    shuffle: true
    fraction: 1.0
  - name: openwebmath_200m
    dataset: openwebmath_200m
    seq_len: 2048
    epochs: 1
    end_ratio: 0.9444
    shuffle: true
    fraction: 1.0
  - name: starcoder_python_edu_80m
    dataset: starcoder_python_edu_80m
    seq_len: 2048
    epochs: 1
    end_ratio: 0.9889
    shuffle: true
    fraction: 1.0
  - name: ultrachat_rehearsal_20m
    dataset: ultrachat_rehearsal_20m
    seq_len: 2048
    epochs: 1
    end_ratio: 1.0
    shuffle: true
    fraction: 1.0

qa_finetune: {}

tokenizer:
  name: "HuggingFaceTB/cosmo2-tokenizer"
