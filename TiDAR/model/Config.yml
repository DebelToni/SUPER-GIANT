model:
  embedding_size: 576
  num_heads: 9
  num_kv_heads: 3
  num_layers: 30
  feed_forward_size: 1536
  rope_dim: 64
  context_length: 2048
  dropout_rate: 0.0
  activation: silu
  use_remat: false
  param_dtype: float32
  compute_dtype: bfloat16

tidar:
  draft_length: 8
  attn_bias_value: -1.0e10

optimizer:
  base_learning_rate: 2.0e-4
  min_learning_rate: 2.0e-5
  warmup_steps: 500
  weight_decay: 0.10
  gradient_clip_norm: 1.0
  weight_decay_exclusions:
    - bias
    - scale
    - embedding

training:
  batch_size: 2
  gradient_accumulation: 1
  max_epochs: 1
  seed: 0
  log_every: 25
  checkpoint_every: 200
  mini_checkpoint_every: 50
  mini_max_to_keep: 2
  label_smoothing: 0.0
  scan_chunk: 4

stages:
  - name: tinystories_posttrain
    dataset: tinystories_posttrain
    seq_len: 256
    epochs: 1
    end_ratio: 1.0
    shuffle: true
    fraction: 1.0

inference:
  stop_on_eos: true
  max_decode_steps: 64
  temperature: 1.0
  top_k: 0
  draft_length: 8
