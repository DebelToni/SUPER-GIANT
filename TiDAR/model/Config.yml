model:
  embedding_size: 576
  num_heads: 9
  num_kv_heads: 3
  num_layers: 30
  feed_forward_size: 1536
  rope_dim: 64
  context_length: 2048
  dropout_rate: 0.0
  activation: silu
  use_remat: false
  param_dtype: float32
  compute_dtype: bfloat16

tidar:
  draft_length: 8
  attn_bias_value: -1.0e10

inference:
  stop_on_eos: true
  max_decode_steps: 64
  temperature: 1.0
  top_k: 0
  draft_length: 8

tokenizer:
  name: "HuggingFaceTB/cosmo2-tokenizer"
