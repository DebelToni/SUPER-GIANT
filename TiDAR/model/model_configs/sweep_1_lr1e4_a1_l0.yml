model:
  embedding_size: 576
  num_heads: 9
  num_kv_heads: 3
  num_layers: 30
  feed_forward_size: 1536
  rope_dim: 64
  context_length: 2048
  dropout_rate: 0.0
  use_remat: false
  param_dtype: float32
  compute_dtype: bfloat16

tidar:
  draft_length: 5
  attn_bias_value: -1.0e10

inference:
  stop_on_eos: true
  max_decode_steps: 64
  temperature: 1.0
  top_k: 0
  draft_length: 5

optimizer:
  base_learning_rate: 1.0e-4
  min_learning_rate: 1.0e-5
  warmup_steps: 2000
  weight_decay: 0.01
  gradient_clip_norm: 0.5
  weight_decay_exclusions:
    - bias
    - scale

training:
  batch_size: 8
  gradient_accumulation: 4
  max_epochs: 1
  seed: 0
  dataset_dir: "Sweep/Data/sweep_1_lr1e4_a1_l0"
  log_every: 500
  checkpoint_every: 20000
  mini_checkpoint_every: 100
  mini_max_to_keep: 2
  label_smoothing: 0.05
  scan_chunk: 1
  loss:
    alpha: 1.0
    agreement_lambda: 0.0

paths:
  params_dir: "Sweep/Params/sweep_1_lr1e4_a1_l0_params"

stages:
  - name: fw_edu_67m
    dataset: fw_edu_67m
    seq_len: 2048
    epochs: 1
    end_ratio: 0.67
    shuffle: true
    fraction: 1.0
  - name: cosmopedia_v2_17m
    dataset: cosmopedia_v2_17m
    seq_len: 2048
    epochs: 1
    end_ratio: 0.84
    shuffle: true
    fraction: 1.0
  - name: openwebmath_11m
    dataset: openwebmath_11m
    seq_len: 2048
    epochs: 1
    end_ratio: 0.95
    shuffle: true
    fraction: 1.0
  - name: starcoder_python_edu_4m
    dataset: starcoder_python_edu_4m
    seq_len: 2048
    epochs: 1
    end_ratio: 0.99
    shuffle: true
    fraction: 1.0
  - name: ultrachat_rehearsal_1m
    dataset: ultrachat_rehearsal_1m
    seq_len: 2048
    epochs: 1
    end_ratio: 1.0
    shuffle: true
    fraction: 1.0

qa_finetune: {}

tokenizer:
  name: "HuggingFaceTB/cosmo2-tokenizer"
