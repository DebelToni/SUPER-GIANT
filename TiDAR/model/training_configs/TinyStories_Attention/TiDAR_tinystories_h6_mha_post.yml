# TiDAR post-training from GIANT h6 MHA run

model:
  embedding_size: 576
  num_heads: 6
  num_kv_heads: 6
  num_layers: 12
  feed_forward_size: 1728
  rope_dim: 32
  context_length: 512
  dropout_rate: 0.0
  use_remat: false
  param_dtype: float32
  compute_dtype: bfloat16

tokenizer:
  use_custom: true
  custom_path: "/proj/giant-data/TiDAR/Tiny_tokenizer"

tidar:
  draft_length: 6
  attn_bias_value: -1.0e10

inference:
  stop_on_eos: true
  max_decode_steps: 64
  temperature: 1.0
  top_k: 0
  draft_length: 6

optimizer:
  base_learning_rate: 5.0e-5
  min_learning_rate: 5.0e-6
  warmup_steps: 500
  weight_decay: 0.01
  gradient_clip_norm: 0.5
  weight_decay_exclusions:
    - bias
    - scale

training:
  batch_size: 12
  gradient_accumulation: 2
  seed: 42
  dataset_dir: "dataset_artifacts/TinyStories_exp"
  log_every: 200
  checkpoint_every: 5000
  mini_checkpoint_every: 500
  mini_max_to_keep: 2
  scan_chunk: 2
  loss:
    alpha: 1.0
    beta: 1.0

paths:
  data_root: "/proj/giant-data/TiDAR"
  processed_data_root: "dataset_artifacts"
  checkpoints_root: "checkpoints/TinyStories_exp/head_sweep/tidar_h6_mha"

stages:
  - name: tinystories_512_full_epoch
    dataset: tinystories_512
    seq_len: 512
    epochs: 1
    end_ratio: 1.0
    shuffle: false
    fraction: 1.0

qa_finetune: {}
