tokenizer:
  name: "clowman/Llama-3.2-3B-Instruct-AWQ-Int4"
  cache_dir: "tokenizer_cache"
  use_custom: false
  custom_path: "math_tokenizer_data"
  pad_token_override: null

paths:
  processed_data_root: "dataset_artifacts"
  dataloader_state_root: "checkpoints/dataloader_state"
  logs_root: "logs"

training_defaults:
  progressive_sequence_lengths: [256, 512, 1024]
  lr_milestones: [0.1, 0.4, 0.7]
  warmup_steps: 1000
  grad_accumulation: 2
  global_seed: 0

io:
  shard_size_tokens: 2048
  validation_fraction: 0.01
  min_sequence_tokens: 128

