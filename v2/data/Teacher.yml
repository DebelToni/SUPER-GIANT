# Teacher.yml
model_path: "/model"               # Model path (inside container or model name for HF) 
output_dataset_path: "./teacher_dataset.arrow"   # Where to save the generated dataset

# Generation parameters
num_questions: 200                # Number of questions to generate in stage 1
question_generation_prompt: |
  You are ChatGPT, a large language model. 
  Generate a list of 200 creative and diverse questions that a user might ask an AI assistant. 
  The questions should cover different topics and vary in style and difficulty.
answer_prompt_template: "User: {question}\nAssistant: "   # Template to get answer for a given question
temperature: 0.7
top_p: 0.9
max_tokens_question: 1024         # Max tokens for the question-generation output (should be high to allow many Qs)
max_tokens_answer: 256            # Max tokens per answer

# Special tokens for roles
user_token: "[USER]"
ai_token: "[AI]"

# Docker / environment settings
docker_image: "vllm/vllm-openai:latest"
host_model_dir: "/home/user/models/Qwen3-1.7B-GPTQ"   # Host path where model is stored
container_model_dir: "/model"      # Mounted path inside container for the model
