tiny_stories:
  dataset_name: "roneneldan/TinyStories"
  dataset_split: "train"
  streaming: true
  warmup_fraction: 0.1
  context_length: 256
  max_records: null
  min_tokens: 128
  rows_per_shard: 65536

wikipedia:
  raw_root: "enwiki20201020"
  file_glob: "**/*.json"
  text_field: "text"
  context_length: 1024
  min_tokens: 128
  warmup_fraction: 1.0
  normalization:
    nfkc: true
    collapse_whitespace: true
    strip_markup: true
  pads_to_context: true
  deduplicate: false
  dedup_shingle_size: 12
  dedup_hash_bits: 21
  dedup_max_keys: 2000000
  max_files: null
  max_records: null
  rows_per_shard: 65536

outputs:
  processed_root: "dataset_artifacts"
  tinystories_dir: "tinystories"
  wikipedia_dir: "wikipedia"
  merged_filename: "merged_training.arrow"
  stats_filename: "dataset_stats.json"

scheduling:
  validation_fraction: 0.01
  seed: 4212
  shuffle_buffer_size: 65536
  wiki_num_workers: 64
  write_batch_size: 1024
