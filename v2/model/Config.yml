model:
  embedding_size: 512
  num_heads: 8
  num_layers: 6
  feed_forward_size: 2048
  dropout_rate: 0.05
  activation: silu
  param_dtype: float32
  compute_dtype: float32
  # compute_dtype: bfloat16
  rope_dim: 8
  num_kv_heads: 8
  context_length: 1024

optimizer:
  base_learning_rate: 2.0e-4
  min_learning_rate: 2.0e-5
  weight_decay: 0.05
  gradient_clip_norm: 1.0
  warmup_steps: 1000
  weight_decay_exclusions:
    - bias
    - scale
    - embedding

training:
  batch_size: 8
  gradient_accumulation: 1
  max_epochs: 3
  seed: 0
  log_every: 100
  checkpoint_every: 1000
  # device: gpu
  device: cpu
  label_smoothing: 0.0

stages:
  - name: warmup_tinystories
    dataset: tinystories
    seq_len: 256
    epochs: 1
    end_ratio: 0.1
    shuffle: true
    fraction: 0.1
  - name: wiki_medium
    dataset: wikipedia
    seq_len: 512
    epochs: 1
    end_ratio: 0.4
    shuffle: true
    fraction: 1.0
  - name: wiki_long
    dataset: wikipedia
    seq_len: 1024
    epochs: 1
    end_ratio: 1.0
    shuffle: true
    fraction: 1.0

qa_finetune:
  answers_arrow: "teacher_out/answers.arrow"
  batch_size: 4
  context_length: 1024
  num_epochs: 1
  learning_rate: 5.0e-5
  weight_decay: 0.02
  weight_decay_exclusions:
    - bias
    - scale
    - embedding
  warmup_ratio: 0.1
  distill_topk: 8
  distill_temperature: 2.0
  distill_weight: 0.5
  seed: 1
  log_every: 50
  checkpoint_every: 200
  dataset_fraction: 1.0
